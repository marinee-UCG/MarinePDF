services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marine
      POSTGRES_PASSWORD: marine
      POSTGRES_DB: marinepdf
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U marine -d marinepdf"]
      interval: 5s
      timeout: 5s
      retries: 10
  api: 
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://marine:marine@db:5432/marinepdf
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8001:8000"
  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"           
volumes:
  pgdata:
